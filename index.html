<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odatlar Dashboard PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0b111e;
            --panel-bg: #121a2e;
            --border-color: #1e293b;
            --cyan-accent: #10b981; 
            --cyan-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --card-orange: #f97316;
            --card-blue: #3b82f6;
            --card-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* TOP NAVIGATION */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #1e293b;
            color: var(--text-main);
        }

        .add-habit-btn {
            background: var(--cyan-accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* VIEWS CONTROL */
        .app-view {
            display: none;
        }
        .app-view.active-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 1. KALENDAR VIEW PANELS */
        .matrix-panel {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 16px;
            overflow-x: auto;
        }

        .matrix-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .matrix-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .table-container {
            min-width: 850px;
        }

        .table-row-head {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .col-habit-name {
            width: 180px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .col-days-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(31, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-num-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .col-stats-head {
            width: 80px;
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .habit-matrix-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
            padding: 8px 0;
            border-radius: 8px;
        }

        .habit-title-cell {
            width: 180px;
            font-size: 14px;
            font-weight: 600;
            padding-right: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .delete-icon {
            font-size: 11px;
            cursor: pointer;
            opacity: 0.3;
            margin-right: 8px;
        }
        .habit-matrix-row:hover .delete-icon { opacity: 1; }

        .dots-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(31, 1fr);
            gap: 4px;
        }

        .matrix-dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .matrix-dot.checked {
            background-color: var(--cyan-accent);
            border-color: var(--cyan-accent);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .stats-cell {
            width: 80px;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            font-weight: 700;
        }
        .stat-val-days { color: var(--text-muted); }
        .stat-val-done { color: var(--cyan-accent); }


        /* 2. STATISTIKA VIEW PANELS */
        .stats-grid-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-x: auto;
        }

        .stat-mini-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-width: 100px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-icon { font-size: 16px; margin-bottom: 2px;}
        .card-val { font-size: 18px; font-weight: 800; }
        .card-lbl { font-size: 10px; color: var(--text-muted); font-weight: 600;}

        .chart-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .svg-chart-container {
            width: 100%;
            height: 160px;
            position: relative;
            margin-top: 10px;
        }


        /* POPUP DIALOG */
        .form-overlay {
            display: none;
            background: rgba(0,0,0,0.8);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .inp-flat {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .inp-flat:focus { border-color: var(--cyan-accent); }

        .form-actions { display: flex; gap: 8px; }
        .btn-cancel { flex: 1; background: #1e293b; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600;}
        .btn-save { flex: 1; background: var(--cyan-accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 700;}
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="nav-tabs">
            <button class="tab-btn" onclick="switchView('kunlik')">Kunlik</button>
            <button class="tab-btn active" id="tab-kalendar" onclick="switchView('kalendar')">Kalendar</button>
            <button class="tab-btn" id="tab-statistika" onclick="switchView('statistika')">Statistika</button>
        </div>
        <button class="add-habit-btn" onclick="openModal()">
            <span>+</span> Odat qo'shish
        </button>
    </div>

    <div id="view-kalendar" class="app-view active-view">
        <div class="matrix-panel">
            <div class="matrix-header">
                <h2>Odatlar jadvali</h2>
                <div class="month-selector">
                    <span style="color: var(--text-muted); cursor:pointer;">&lt;</span>
                    <span id="current-month-lbl">Iyun</span>
                    <span style="color: var(--text-muted); cursor:pointer;">&gt;</span>
                </div>
            </div>

            <div class="table-container">
                <div class="table-row-head">
                    <div class="col-habit-name">Odatlar</div>
                    <div class="col-days-grid" id="days-header-root"></div>
                    <div class="col-stats-head">
                        <span>Kun</span>
                        <span>Bajaril</span>
                    </div>
                </div>
                <div class="habits-list" id="matrix-body-root"></div>
            </div>
        </div>
    </div>

    <div id="view-statistika" class="app-view">
        <div class="matrix-header" style="margin-top: 4px; margin-bottom: 0;">
            <h2 style="font-size: 20px;">Odat statistikasi</h2>
        </div>
        <p style="color: var(--text-muted); font-size: 12px; margin-top: -6px;">Odatlaringiz bajarilish ko'rsatkichlari</p>

        <div class="stats-grid-row">
            <div class="stat-mini-card">
                <span class="card-icon" style="color: var(--cyan-accent);">🎯</span>
                <span class="card-val" id="st-total-habits">5</span>
                <span class="card-lbl">Jami odatlar</span>
            </div>
            <div class="stat-mini-card">
                <span class="card-icon" style="color: var(--cyan-accent);">✓</span>
                <span class="card-val" id="st-today-done">0/5</span>
                <span class="card-lbl">Bugun bajarildi</span>
            </div>
            <div class="stat-mini-card">
                <span class="card-icon" style="color: var(--card-orange);">🔥</span>
                <span class="card-val" id="st-week-done">0</span>
                <span class="card-lbl">Bu hafta bajarildi</span>
            </div>
            <div class="stat-mini-card">
                <span class="card-icon" style="color: var(--card-blue);">⚡</span>
                <span class="card-val" id="st-week-trend">0%</span>
                <span class="card-lbl">Haftalik trend</span>
            </div>
            <div class="stat-mini-card">
                <span class="card-icon" style="color: var(--card-purple);">🏅</span>
                <span class="card-val" id="st-all-done">0</span>
                <span class="card-lbl">Jami bajarilgan</span>
            </div>
        </div>

        <div class="chart-panel">
            <span class="chart-title">Haftalik ko'rsatkich</span>
            <div class="svg-chart-container">
                <svg width="100%" height="100%" viewBox="0 0 500 150" preserveAspectRatio="none">
                    <line x1="0" y1="30" x2="500" y2="30" stroke="#1e293b" stroke-dasharray="4"/>
                    <line x1="0" y1="75" x2="500" y2="75" stroke="#1e293b" stroke-dasharray="4"/>
                    <line x1="0" y1="120" x2="500" y2="120" stroke="#1e293b"/>
                    
                    <path d="M 35 120 L 105 120 L 175 120 L 245 120 L 315 120 L 385 120 L 455 120" 
                          fill="none" stroke="#10b981" stroke-width="3" id="chart-line-path"/>
                    
                    <circle cx="35" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-0"/>
                    <circle cx="105" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-1"/>
                    <circle cx="175" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-2"/>
                    <circle cx="245" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-3"/>
                    <circle cx="315" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-4"/>
                    <circle cx="385" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-5"/>
                    <circle cx="455" cy="120" r="5" fill="#121a2e" stroke="#10b981" stroke-width="3" id="dot-6"/>

                    <text x="35" y="145" fill="#64748b" font-size="11" text-anchor="middle">Yak</text>
                    <text x="105" y="145" fill="#64748b" font-size="11" text-anchor="middle">Dush</text>
                    <text x="175" y="145" fill="#64748b" font-size="11" text-anchor="middle">Sesh</text>
                    <text x="245" y="145" fill="#64748b" font-size="11" text-anchor="middle">Chor</text>
                    <text x="315" y="145" fill="#64748b" font-size="11" text-anchor="middle">Pay</text>
                    <text x="385" y="145" fill="#64748b" font-size="11" text-anchor="middle">Jum</text>
                    <text x="455" y="145" fill="#64748b" font-size="11" text-anchor="middle">Shan</text>
                </svg>
            </div>
        </div>
    </div>

    <div class="form-overlay" id="modal-form">
        <div class="form-card">
            <h3 style="font-size: 16px; font-weight:700;">Yangi odat shakllantirish</h3>
            <input type="text" id="habit-name-inp" class="inp-flat" placeholder="Odat nomi (Masalan: Ertalab yugurish)">
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeModal()">Bekor qilish</button>
                <button class="btn-save" onclick="createHabitRow()">Qo'shish</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Odatlar bazasi
        let matrixHabits = JSON.parse(localStorage.getItem('matrix_habits_v3')) || [
            { id: 1, name: "Ertalab yugurish", history: [1, 2, 4] },
            { id: 2, name: "10 bet kitob o'qish", history: [2, 3] },
            { id: 3, name: "Qur'on xatm qilish", history: [1] },
            { id: 4, name: "Zalga qatnash", history: [3, 4] },
            { id: 5, name: "2 litr suv ichish", history: [1, 2, 3, 4, 5] }
        ];

        function triggerHaptic() {
            try { if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
        }

        function switchView(viewName) {
            triggerHaptic();
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if(viewName === 'kalendar') {
                document.getElementById('view-kalendar').classList.add('active-view');
                document.getElementById('tab-kalendar').classList.add('active');
            } else if(viewName === 'statistika') {
                document.getElementById('view-statistika').classList.add('active-view');
                document.getElementById('tab-statistika').classList.add('active');
                calculateStats();
            }
        }

        function openModal() {
            triggerHaptic();
            document.getElementById('modal-form').style.display = 'flex';
            document.getElementById('habit-name-inp').focus();
        }

        function closeModal() {
            document.getElementById('modal-form').style.display = 'none';
            document.getElementById('habit-name-inp').value = '';
        }

        function createHabitRow() {
            const inp = document.getElementById('habit-name-inp');
            const name = inp.value.trim();
            if (!name) return;

            matrixHabits.push({ id: Date.now(), name: name, history: [] });
            saveAndRender();
            closeModal();
        }

        function deleteHabitRow(id) {
            triggerHaptic();
            matrixHabits = matrixHabits.filter(h => h.id !== id);
            saveAndRender();
        }

        function toggleDayCheck(habitId, dayNumber) {
            triggerHaptic();
            const habit = matrixHabits.find(h => h.id === habitId);
            if (habit) {
                const index = habit.history.indexOf(dayNumber);
                if (index > -1) {
                    habit.history.splice(index, 1);
                } else {
                    habit.history.push(dayNumber);
                    try {
                        tg.sendData(`🎯 ${habit.name} | Bajarildi (Kun: ${dayNumber})`);
                    } catch(e) {}
                }
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('matrix_habits_v3', JSON.stringify(matrixHabits));
            renderMatrixTable();
            calculateStats();
        }

        function renderMatrixTable() {
            const headerRoot = document.getElementById('days-header-root');
            headerRoot.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const lbl = document.createElement('div');
                lbl.className = 'day-num-label';
                lbl.innerText = i;
                headerRoot.appendChild(lbl);
            }

            const bodyRoot = document.getElementById('matrix-body-root');
            bodyRoot.innerHTML = '';

            matrixHabits.forEach(habit => {
                const row = document.createElement('div');
                row.className = 'habit-matrix-row';

                const titleCell = document.createElement('div');
                titleCell.className = 'habit-title-cell';
                titleCell.innerHTML = `<span>${habit.name}</span><span class="delete-icon" onclick="deleteHabitRow(${habit.id})">🗑️</span>`;
                row.appendChild(titleCell);

                const dotsGrid = document.createElement('div');
                dotsGrid.className = 'dots-grid';

                for (let d = 1; d <= 31; d++) {
                    const dot = document.createElement('div');
                    const isChecked = habit.history.includes(d);
                    dot.className = `matrix-dot ${isChecked ? 'checked' : ''}`;
                    dot.setAttribute('onclick', `toggleDayCheck(${habit.id}, ${d})`);
                    dotsGrid.appendChild(dot);
                }
                row.appendChild(dotsGrid);

                const statsCell = document.createElement('div');
                statsCell.className = 'stats-cell';
                statsCell.innerHTML = `<span class="stat-val-days">31</span><span class="stat-val-done">${habit.history.length}</span>`;
                row.appendChild(statsCell);

                bodyRoot.appendChild(row);
            });
        }

        // STATISTIKANI HISOBLASH VA GRAFIKNI CHIZISH
        function calculateStats() {
            const currentDay = new Date().getDate();
            
            // 1. Jami Odatlar
            document.getElementById('st-total-habits').innerText = matrixHabits.length;
            
            // 2. Bugun Bajarildi
            let todayDone = 0;
            matrixHabits.forEach(h => { if(h.history.includes(currentDay)) todayDone++; });
            document.getElementById('st-today-done').innerText = `${todayDone}/${matrixHabits.length}`;

            // 3. Jami Bajarilganlar soni (Barcha kunlar yig'indisi)
            let grandTotal = 0;
            matrixHabits.forEach(h => grandTotal += h.history.length);
            document.getElementById('st-all-done').innerText = grandTotal;

            // 4. Haftalik ma'lumotlar simulyatsiyasi (SVG Grafik nuqtalari uchun)
            // Grafik asosi balandligi 120px (bajarilmaganda 120 da turadi, maksimalda 30 gacha ko'tariladi)
            let weeklyCounts = [0, 0, 0, 0, 0, 0, 0]; 
            matrixHabits.forEach(h => {
                h.history.forEach(day => {
                    if(day >= 1 && day <= 7) weeklyCounts[day-1]++;
                });
            });

            let totalWeekDone = weeklyCounts.reduce((a, b) => a + b, 0);
            document.getElementById('st-week-done').innerText = totalWeekDone;

            // Trend foizi
            let trend = matrixHabits.length > 0 ? Math.round((totalWeekDone / (matrixHabits.length * 7)) * 100) : 0;
            document.getElementById('st-week-trend').innerText = trend + "%";

            // SVG Yo'nalish chizig'ini yangilash
            let points = [];
            const xCoords = [35, 105, 175, 245, 315, 385, 455];
            
            for(let i=0; i<7; i++) {
                // Balandlikni hisoblash (Odatlar soniga qarab dynamic o'zgaradi)
                let maxHabits = matrixHabits.length || 1;
                let ratio = weeklyCounts[i] / maxHabits;
                let y = 120 - (ratio * 90); // 30px gacha ko'tarilishi mumkin
                
                points.push(`${xCoords[i]} ${y}`);
                
                let dot = document.getElementById(`dot-${i}`);
                if(dot) dot.setAttribute('cy', y);
            }
            
            let pathD = "M " + points.join(" L ");
            document.getElementById('chart-line-path').setAttribute('d', pathD);
        }

        // Boshlang'ich yuklash
        renderMatrixTable();
        calculateStats();
    </script>
</body>
</html>
