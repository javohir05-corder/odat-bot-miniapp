<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odatlarim PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e2530 0%, #0f1218 100%);
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-neon: #7fff00;
            --accent-dimmed: #4ca600;
            --text-main: #ffffff;
            --text-muted: #8e99a7;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--accent-neon);
            text-shadow: 0 0 15px rgba(127, 255, 0, 0.4);
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-panel {
            width: 100%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-box {
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-neon);
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .section-title {
            width: 100%;
            max-width: 380px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .habit-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .habit-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .habit-name {
            font-size: 16px;
            font-weight: 600;
        }

        .habit-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .habit-action-btn {
            background: transparent;
            border: 2px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(127, 255, 0, 0.1);
        }

        .habit-action-btn:active {
            transform: scale(0.95);
        }

        .habit-action-btn.done {
            background: var(--accent-neon);
            color: #000000;
            box-shadow: 0 0 15px var(--accent-neon);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-title">ODATLARIM <span>PRO</span></h1>
        <p>Intizom & O'sish</p>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-val">100%</div>
            <div class="stat-lbl">Fokus</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="streak-val">🔥 1</div>
            <div class="stat-lbl">Kunlik Streak</div>
        </div>
        <div class="stat-box">
            <div class="stat-val">3 / 3</div>
            <div class="stat-lbl">Maqsadlar</div>
        </div>
    </div>

    <div class="section-title">Odatlar ro'yxati</div>

    <div class="habit-list">
        <div class="habit-card">
            <div class="habit-info">
                <span class="habit-name">📚 Kitob o'qish</span>
                <span class="habit-meta">Har kuni · 30 daqiqa</span>
            </div>
            <button class="habit-action-btn" onclick="triggerHabit('Kitob o\'qish', this)">Bajarish</button>
        </div>

        <div class="habit-card">
            <div class="habit-info">
                <span class="habit-name">🏃‍♂️ Sport / Yugurish</span>
                <span class="habit-meta">Har kuni · 45 daqiqa</span>
            </div>
            <button class="habit-action-btn" onclick="triggerHabit('Sport / Yugurish', this)">Bajarish</button>
        </div>

        <div class="habit-card">
            <div class="habit-info">
                <span class="habit-name">💧 Suv ichish</span>
                <span class="habit-meta">Kun davomida · 2 Litr</span>
            </div>
            <button class="habit-action-btn" onclick="triggerHabit('Suv ichish', this)">Bajarish</button>
        </div>
    </div>

    <script>
        const telegram = window.Telegram.WebApp;
        telegram.expand();
        telegram.ready();

        if (telegram.initDataUnsafe && telegram.initDataUnsafe.user) {
            const firstName = telegram.initDataUnsafe.user.first_name;
            document.getElementById('user-title').innerHTML = `${firstName.toUpperCase()} <span>PRO</span>`;
        }

        function triggerHabit(name, element) {
            if (element.classList.contains('done')) return;

            element.innerText = "✓ OK";
            element.classList.add('done');

            // Ma'lumotni to'g'ridan-to'g'ri xavfsiz kanallar orqali bot kodingizga uzatish
            setTimeout(() => {
                telegram.sendData(name);
                telegram.close();
            }, 600);
        }
    </script>
</body>
</html>
