<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odatlarim PRO - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e2530 0%, #0f1218 100%);
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-neon: #7fff00;
            --text-main: #ffffff;
            --text-muted: #8e99a7;
            --danger: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .header h1 span {
            color: var(--accent-neon);
            text-shadow: 0 0 15px rgba(127, 255, 0, 0.4);
        }

        .header p {
            color: var(--text-muted);
            font-size: 11px;
            margin: 3px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* STATISTIKA PANEL */
        .stats-panel {
            width: 100%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-box {
            text-align: center;
        }

        .stat-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-neon);
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* REJA VA ODUT QO'SHISH SHAKLI */
        .add-habit-box {
            width: 100%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-habit-box input, .add-habit-box button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            outline: none;
            font-size: 14px;
        }

        .add-habit-box input[type="text"] {
            background: rgba(0,0,0,0.2);
            color: #fff;
        }

        .add-habit-box input[type="time"] {
            background: rgba(0,0,0,0.2);
            color: #fff;
        }

        .add-btn {
            background: var(--accent-neon);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none !important;
        }

        .section-title {
            width: 100%;
            max-width: 380px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* ODUTLAR RO'YXATI */
        .habit-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .habit-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .habit-name {
            font-size: 15px;
            font-weight: 600;
        }

        .habit-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .actions-div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: 1.5px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .action-btn.done {
            background: var(--accent-neon);
            color: #000;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-title">ODATLARIM <span>PRO</span></h1>
        <p id="current-date">Sana: --.--.----</p>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-val" id="total-val">0</div>
            <div class="stat-lbl">Odatlar soni</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="done-val">0</div>
            <div class="stat-lbl">Bajarildi</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="percent-val">0%</div>
            <div class="stat-lbl">Kunlik Foiz</div>
        </div>
    </div>

    <div class="add-habit-box">
        <input type="text" id="habit-input" placeholder="Odat nomini yozing... (masalan: Kitob o'qish)">
        <div style="display: flex; gap: 8px;">
            <input type="time" id="habit-time" style="flex: 1;" value="08:00">
            <button class="add-btn" onclick="addHabit()" style="flex: 1;">Odat Qo'shish +</button>
        </div>
    </div>

    <div class="section-title">
        <span>Bugungi Rejalar</span>
        <span style="color: var(--accent-neon);" id="list-status">0/0</span>
    </div>

    <div class="habit-list" id="habits-container"></div>

    <script>
        const telegram = window.Telegram.WebApp;
        telegram.expand();
        telegram.ready();

        // Sanani chiqarish
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('uz-UZ', options);

        if (telegram.initDataUnsafe && telegram.initDataUnsafe.user) {
            document.getElementById('user-title').innerHTML = `${telegram.initDataUnsafe.user.first_name.toUpperCase()} <span>PRO</span>`;
        }

        // LocalStorage dan ma'lumotlarni yuklash yoki boshlang'ich qiymat berish
        let habits = JSON.parse(localStorage.getItem('user_habits')) || [
            { id: 1, name: "📚 Kitob o'qish", time: "08:00", done: false },
            { id: 2, name: "🏃‍♂️ Sport bilan shug'ullanish", time: "17:30", done: false },
            { id: 3, name: "💧 2 Litr suv ichish", time: "12:00", done: false }
        ];

        // Sanani tekshirish (Har yangi kun kelganda odatlar statusini reset qilish)
        const lastSavedDate = localStorage.getItem('last_saved_date');
        const todayStr = new Date().toDateString();
        if (lastSavedDate !== todayStr) {
            habits.forEach(h => h.done = false);
            localStorage.setItem('last_saved_date', todayStr);
            localStorage.setItem('user_habits', JSON.stringify(habits));
        }

        function saveAndRender() {
            localStorage.setItem('user_habits', JSON.stringify(habits));
            renderHabits();
        }

        function renderHabits() {
            const container = document.getElementById('habits-container');
            container.innerHTML = '';
            
            let doneCount = 0;
            habits.forEach(habit => {
                if(habit.done) doneCount++;

                const card = document.createElement('div');
                card.className = 'habit-card';
                card.innerHTML = `
                    <div class="habit-info">
                        <span class="habit-name">${habit.name}</span>
                        <span class="habit-meta">⏰ Reja vaqti: ${habit.time}</span>
                    </div>
                    <div class="actions-div">
                        <button class="action-btn ${habit.done ? 'done' : ''}" onclick="toggleHabit(${habit.id})">
                            ${habit.done ? '✓ Bajarildi' : 'Bajarish'}
                        </button>
                        <button class="delete-btn" onclick="deleteHabit(${habit.id})">🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // Statistikani hisoblash
            const totalCount = habits.length;
            const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

            document.getElementById('total-val').innerText = totalCount;
            document.getElementById('done-val').innerText = doneCount;
            document.getElementById('percent-val').innerText = percent + "%";
            document.getElementById('list-status').innerText = `${doneCount}/${totalCount}`;
        }

        function addHabit() {
            const input = document.getElementById('habit-input');
            const timeInput = document.getElementById('habit-time');
            
            if (!input.value.trim()) return;

            const newHabit = {
                id: Date.now(),
                name: input.value.trim(),
                time: timeInput.value,
                done: false
            };

            habits.push(newHabit);
            input.value = '';
            saveAndRender();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveAndRender();
        }

        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.done = !habit.done;
                saveAndRender();

                // Agar bajarilgan bo'lsa, ma'lumotni hisobot sifatida botga uzatamiz
                if(habit.done) {
                    const doneCount = habits.filter(h => h.done).length;
                    const percent = Math.round((doneCount / habits.length) * 100);
                    
                    // Botga ketadigan formatlangan matn matni
                    const reportData = `${habit.name} (Vaqti: ${habit.time}) | Umumiy: ${doneCount}/${habits.length} (${percent}%)`;
                    
                    setTimeout(() => {
                        telegram.sendData(reportData);
                        telegram.close();
                    }, 500);
                }
            }
        }

        // Ilk yuklanganda render qilish
        renderHabits();
    </script>
</body>
</html>
