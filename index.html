<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odatlarim PRO - Ultra Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0f16;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --lime-neon: #7fff00;
            --lime-glow: rgba(127, 255, 0, 0.4);
            --text-white: #ffffff;
            --text-gray: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1a2230 0%, var(--bg-main) 100%);
            color: var(--text-white);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* BRAND HEADER */
        .brand-header {
            text-align: center;
            margin-top: 5px;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-header h1 span {
            color: var(--lime-neon);
            text-shadow: 0 0 12px var(--lime-glow);
        }

        .brand-header p {
            color: var(--text-gray);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        /* 3D GLASS PANEL STYLE */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 10px 35px rgba(0,0,0,0.6);
        }

        .panel-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-gray);
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* GRID ARXITEKTURA */
        .dashboard-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* STATISTIKA (CHAP PANEL KONSEPCIYASI) */
        .stat-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .circle-box {
            position: relative;
            width: 76px;
            height: 76px;
        }

        .circle-box svg {
            width: 76px;
            height: 76px;
            transform: rotate(-90deg);
        }

        .c-bg { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 7; }
        .c-fill {
            fill: none;
            stroke: var(--lime-neon);
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .circle-inner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15px;
            font-weight: 800;
            color: var(--lime-neon);
            text-shadow: 0 0 10px var(--lime-glow);
        }

        .stat-rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .s-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .s-item span:first-child { color: var(--text-gray); }
        .s-item span:last-child { font-weight: bold; }

        /* ODUTLAR VA VAQT REJASI (O'RTA PANEL KONSEPCIYASI) */
        .habits-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .habit-row {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .habit-row.completed {
            border-color: rgba(127, 255, 0, 0.2);
            background: rgba(127, 255, 0, 0.01);
        }

        .habit-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .h-title {
            font-size: 15px;
            font-weight: 600;
        }
        .habit-row.completed .h-title {
            color: var(--text-gray);
            text-decoration: line-through;
        }

        .h-time {
            font-size: 11px;
            color: var(--lime-neon);
            background: rgba(127, 255, 0, 0.1);
            padding: 1px 6px;
            border-radius: 6px;
            width: fit-content;
            font-weight: 700;
        }

        .btn-action-glow {
            background: transparent;
            border: 2px solid var(--lime-neon);
            color: var(--lime-neon);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action-glow.active {
            background: var(--lime-neon);
            color: #0c0f16;
            box-shadow: 0 0 12px var(--lime-neon);
        }

        .btn-del {
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
        }

        /* VAQT REJASI GRAPHIC LINE */
        .timeline-track {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 15px 5px 5px 5px;
        }
        .timeline-track::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255,255,255,0.06);
            transform: translateY(-50%);
            z-index: 1;
        }
        .time-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-gray);
            z-index: 2;
            position: relative;
        }
        .time-dot.active {
            background: var(--lime-neon);
            box-shadow: 0 0 8px var(--lime-neon);
        }

        /* KUNLIK MAQSADLAR & MUKOFOTLAR (O'NG PANEL KONSEPCIYASI) */
        .rewards-flex {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 0;
        }

        .badge-card {
            text-align: center;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .badge-card.unlocked {
            opacity: 1;
        }
        .badge-icon {
            font-size: 24px;
            margin-bottom: 2px;
        }
        .badge-title {
            font-size: 10px;
            color: var(--text-gray);
        }
        .badge-card.unlocked .badge-title {
            color: var(--lime-neon);
        }

        /* QUICK ADD TRIGGER & FORM */
        .trigger-add {
            background: rgba(255,255,255,0.01);
            border: 1px dashed var(--glass-border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--lime-neon);
            cursor: pointer;
            font-weight: 700;
        }

        .form-add {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .inp-neon {
            background: #06080c;
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .inp-neon:focus { border-color: var(--lime-neon); }

        .btn-send {
            background: var(--lime-neon);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 id="user-title">ODATLARIM <span>PRO</span></h1>
        <p>Intizom & O'sish</p>
    </div>

    <div class="dashboard-layout">

        <div class="glass-panel">
            <div class="panel-header">Habit Streak & Progress</div>
            <div class="stat-flex">
                <div class="circle-box">
                    <svg>
                        <circle class="c-bg" cx="38" cy="38" r="33"></circle>
                        <circle class="c-fill" id="progress-circle" cx="38" cy="38" r="33" stroke-dasharray="207.34" stroke-dashoffset="207.34"></circle>
                    </svg>
                    <div class="circle-inner-text" id="lbl-percent">0%</div>
                </div>
                <div class="stat-rows">
                    <div class="s-item"><span>Fokus darajasi:</span><span id="lbl-focus" style="color: var(--lime-neon);">0%</span></div>
                    <div class="s-item"><span>Bajarildi / Reja:</span><span id="lbl-ratio">0/0</span></div>
                    <div class="s-item"><span>Kunlik Streak:</span><span>🔥 1 Kun</span></div>
                </div>
            </div>
        </div>

        <div class="trigger-add" id="btn-trigger" onclick="toggleForm()">+ YANGI ODAT QO'SHISH</div>
        <div class="form-add" id="panel-form">
            <input type="text" id="add-name" class="inp-neon" placeholder="Odat nomi (Masalan: 📚 Kitob o'qish)">
            <div style="display: flex; gap: 8px;">
                <input type="time" id="add-time" class="inp-neon" style="flex: 1;" value="08:00">
                <button class="btn-send" style="flex: 1;" onclick="saveNewHabit()">Saqlash</button>
            </div>
        </div>

        <div class="glass-panel">
            <div class="panel-header">
                <span>Vaqt Rejasi & Odatlar</span>
                <span id="txt-counter" style="color: var(--lime-neon);">0 / 0</span>
            </div>
            
            <div class="habits-stack" id="habits-root"></div>

            <div style="margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 12px;">
                <div class="panel-header" style="font-size: 9px; margin-bottom: 6px;">Vaqt Chizig'i (Grafik)</div>
                <div class="timeline-track" id="timeline-root"></div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="panel-header">Mukofotlar & Erkinlik</div>
            <div class="rewards-flex">
                <div class="badge-card" id="badge-1">
                    <div class="badge-icon">🎯</div>
                    <div class="badge-title">Boshlanishi</div>
                </div>
                <div class="badge-card" id="badge-2">
                    <div class="badge-icon">⚡</div>
                    <div class="badge-title">Yarim Reja</div>
                </div>
                <div class="badge-card" id="badge-3">
                    <div class="badge-icon">👑</div>
                    <div class="badge-title">Chempion</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-title').innerHTML = `${tg.initDataUnsafe.user.first_name.toUpperCase()} <span>PRO</span>`;
        }

        let habits = JSON.parse(localStorage.getItem('ultra_habits_v1')) || [
            { id: 1, name: "📚 Kitob o'qish", time: "08:00", done: false },
            { id: 2, name: "🏃‍♂️ Sport / Yugurish", time: "12:30", done: false },
            { id: 3, name: "💧 Suv ichish", time: "19:00", done: false }
        ];

        const savedDay = localStorage.getItem('ultra_day_stamp');
        const currentDay = new Date().toDateString();
        if (savedDay !== currentDay) {
            habits.forEach(h => h.done = false);
            localStorage.setItem('ultra_day_stamp', currentDay);
            localStorage.setItem('ultra_habits_v1', JSON.stringify(habits));
        }

        function triggerHaptic() {
            try {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                } else if (navigator.vibrate) {
                    navigator.vibrate(45);
                }
            } catch(e) {}
        }

        function toggleForm() {
            triggerHaptic();
            const form = document.getElementById('panel-form');
            const btn = document.getElementById('btn-trigger');
            if(form.style.display === 'flex') {
                form.style.display = 'none';
                btn.innerText = "+ YANGI ODAT QO'SHISH";
            } else {
                form.style.display = 'flex';
                btn.innerText = "✕ BERKITISH";
                document.getElementById('add-name').focus();
            }
        }

        function saveNewHabit() {
            const nameInp = document.getElementById('add-name');
            const timeInp = document.getElementById('add-time');
            if(!nameInp.value.trim()) return;

            habits.push({
                id: Date.now(),
                name: nameInp.value.trim(),
                time: timeInp.value,
                done: false
            });

            nameInp.value = '';
            toggleForm();
            syncData();
        }

        function removeHabit(id) {
            triggerHaptic();
            habits = habits.filter(h => h.id !== id);
            syncData();
        }

        function toggleStatus(id) {
            triggerHaptic();
            const target = habits.find(h => h.id === id);
            if(target) {
                target.done = !target.done;
                syncData();

                if(target.done) {
                    const doneCount = habits.filter(h => h.done).length;
                    const totalCount = habits.length;
                    const percent = Math.round((doneCount / totalCount) * 100);
                    
                    // Botga uzatiladigan dynamic toza ma'lumot
                    const payload = `${target.name} (Vaqt: ${target.time}) | Status: ${doneCount}/${totalCount} (${percent}%)`;
                    
                    setTimeout(() => {
                        tg.sendData(payload);
                        tg.close();
                    }, 500);
                }
            }
        }

        function syncData() {
            localStorage.setItem('ultra_habits_v1', JSON.stringify(habits));
            renderDashboard();
        }

        function renderDashboard() {
            const root = document.getElementById('habits-root');
            const timeline = document.getElementById('timeline-root');
            root.innerHTML = '';
            timeline.innerHTML = '';

            habits.sort((a,b) => a.time.localeCompare(b.time));
            let doneCount = 0;

            habits.forEach(h => {
                if(h.done) doneCount++;

                // Odatlar ro'yxati (O'rta panel)
                const card = document.createElement('div');
                card.className = `habit-row ${h.done ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="habit-meta">
                        <span class="h-title">${h.name}</span>
                        <span class="h-time">${h.time}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <button class="btn-action-glow ${h.done ? 'active' : ''}" onclick="toggleStatus(${h.id})">
                            ${h.done ? '✓ OK' : 'Bajarish'}
                        </button>
                        <button class="btn-del" onclick="removeHabit(${h.id})">🗑️</button>
                    </div>
                `;
                root.appendChild(card);

                // Vaqt chizig'i (O'rta panel osti grafik element)
                const dot = document.createElement('div');
                dot.className = `time-dot ${h.done ? 'active' : ''}`;
                timeline.appendChild(dot);
            });

            const totalCount = habits.length;
            const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

            // Statistikani yangilash
            document.getElementById('lbl-percent').innerText = percent + "%";
            document.getElementById('lbl-focus').innerText = percent + "%";
            document.getElementById('lbl-ratio').innerText = `${doneCount}/${totalCount}`;
            document.getElementById('txt-counter').innerText = `${doneCount} / ${totalCount}`;

            // Doiraviy grafikni neon chizish
            const circle = document.getElementById('progress-circle');
            const circumference = 2 * Math.PI * 33;
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = offset;

            // Mukofotlarni dynamic blokdan chiqarish (O'ng panel)
            document.getElementById('badge-1').classList.toggle('unlocked', doneCount >= 1);
            document.getElementById('badge-2').classList.toggle('unlocked', percent >= 50);
            document.getElementById('badge-3').classList.toggle('unlocked', percent === 100 && totalCount > 0);
        }

        renderDashboard();
    </script>
</body>
</html>
