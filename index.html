<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odatlarim PRO - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-radial: radial-gradient(circle at 50% 30%, #1e2633 0%, #080a0f 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-blur: blur(20px);
            --neon-green: #7fff00;
            --neon-shadow: 0 0 20px rgba(127, 255, 0, 0.5);
            --text-white: #ffffff;
            --text-gray: #7e8b9b;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-main);
            background: var(--bg-radial);
            color: var(--text-white);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* HEADER */
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .brand-header h1 span {
            color: var(--neon-green);
            text-shadow: var(--neon-shadow);
        }

        .brand-header p {
            color: var(--text-gray);
            font-size: 11px;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* MAIN MONITOR WRAPPER */
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 420px;
        }

        /* GLASS CARD COMMON */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* PANEL TITLE */
        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-gray);
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* 1. STATISTIKA PANEL (LEFT CONCEPT) */
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .circle-progress-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .circle-progress-wrapper svg {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .circle-fill {
            fill: none;
            stroke: var(--neon-green);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 800;
            color: var(--neon-green);
            text-shadow: var(--neon-shadow);
        }

        .stat-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .stat-item span:first-child { color: var(--text-gray); }
        .stat-item span:last-child { font-weight: bold; color: #fff;}

        /* 2. MAIN HABITS PANEL (CENTER CONCEPT) */
        .habits-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .habit-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .habit-card:hover {
            border-color: rgba(127, 255, 0, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .habit-info-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .habit-title-text {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .habit-time-badge {
            font-size: 11px;
            color: var(--neon-green);
            background: rgba(127, 255, 0, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
            width: fit-content;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .habit-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* NEON TOGGLE SWITCH LIKE BUTTON */
        .neon-toggle-btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(127, 255, 0, 0.1);
        }

        .neon-toggle-btn.active-done {
            background: var(--neon-green);
            color: #000;
            box-shadow: var(--neon-shadow);
        }

        .trash-action {
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .trash-action:hover { opacity: 1; }

        /* 3. DYNAMIC ADD PANEL (TOP BLENDED) */
        .creator-trigger-btn {
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
            color: var(--text-gray);
            padding: 14px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .creator-trigger-btn:hover {
            color: #fff;
            border-color: var(--neon-green);
        }

        .creator-form {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .creator-form.open { display: flex; }

        .input-glow {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-glow:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(127, 255, 0, 0.2);
        }

        .submit-neon-btn {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--neon-shadow);
        }

        /* VAQT REJASI CHIZIG'I (BOTTOM GRAPH VISUAL) */
        .timeline-visual {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-top: 10px;
            padding: 0 10px;
        }

        .timeline-visual::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255,255,255,0.05);
            z-index: 1;
        }

        .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-gray);
            z-index: 2;
            position: relative;
        }

        .timeline-dot.passed {
            background: var(--neon-green);
            box-shadow: var(--neon-shadow);
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 id="user-display">DASHBOARD <span>PRO</span></h1>
        <p>Intizom & O'sish</p>
    </div>

    <div class="dashboard-grid">
        
        <div class="glass-panel">
            <div class="panel-title">Habit Streak & Progress</div>
            <div class="stat-row">
                <div class="circle-progress-wrapper">
                    <svg>
                        <circle class="circle-bg" cx="40" cy="40" r="32"></circle>
                        <circle class="circle-fill" id="progress-circle" cx="40" cy="40" r="32" stroke-dasharray="201.06" stroke-dashoffset="201.06"></circle>
                    </svg>
                    <div class="circle-text" id="percentage-label">0%</div>
                </div>
                <div class="stat-details">
                    <div class="stat-item">
                        <span>Nimalar qilish kerak:</span>
                        <span id="lbl-total">0 ta</span>
                    </div>
                    <div class="stat-item">
                        <span>Nimalar bajarildi:</span>
                        <span id="lbl-done" style="color: var(--neon-green);">0 ta</span>
                    </div>
                    <div class="stat-item">
                        <span>Kunlik Streak:</span>
                        <span>🔥 1 Kun</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel" style="padding: 15px;">
            <div class="creator-trigger-btn" id="trigger-text" onclick="toggleCreator()">+ YANGI ODUT QO'SHISH</div>
            <div class="creator-form" id="creator-panel">
                <input type="text" id="new-habit-name" class="input-glow" placeholder="Odat nomi (Masalan: Kitob o'qish)">
                <div style="display: flex; gap: 10px;">
                    <input type="time" id="new-habit-time" class="input-glow" style="flex: 1;" value="07:00">
                    <button class="submit-neon-btn" style="flex: 1;" onclick="createNewHabit()">Yozish</button>
                </div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="panel-title" style="display: flex; justify-content: space-between;">
                <span>Vaqt Rejasi & Odatlar</span>
                <span id="counter-top" style="color: var(--neon-green);">0 / 0</span>
            </div>
            
            <div class="habits-container" id="habits-display-list">
                </div>

            <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                <div class="panel-title" style="font-size: 10px; margin-bottom: 8px;">Vaqt Chizig'i</div>
                <div class="timeline-visual" id="timeline-dots-box">
                    <div class="timeline-dot passed"></div>
                    <div class="timeline-dot"></div>
                    <div class="timeline-dot"></div>
                    <div class="timeline-dot"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-display').innerHTML = `${tg.initDataUnsafe.user.first_name.toUpperCase()} <span>PRO</span>`;
        }

        // Boshlang'ich odatlar premium ko'rinishda
        let customHabits = JSON.parse(localStorage.getItem('premium_habits')) || [
            { id: 101, name: "📚 Kitob o'qish", time: "08:00", done: false },
            { id: 102, name: "🏃‍♂️ Sport seanslari", time: "12:30", done: false },
            { id: 103, name: "💧 Suv ichish", time: "19:00", done: false }
        ];

        // Har yangi kun kirganda avtomatik tozalash (Reset)
        const savedDay = localStorage.getItem('premium_saved_day');
        const currentDay = new Date().toDateString();
        if (savedDay !== currentDay) {
            customHabits.forEach(h => h.done = false);
            localStorage.setItem('premium_saved_day', currentDay);
            localStorage.setItem('premium_habits', JSON.stringify(customHabits));
        }

        function toggleCreator() {
            const panel = document.getElementById('creator-panel');
            const trigger = document.getElementById('trigger-text');
            if(panel.classList.contains('open')) {
                panel.classList.remove('open');
                trigger.innerText = "+ YANGI ODUT QO'SHISH";
            } else {
                panel.classList.add('open');
                trigger.innerText = "✕ BERKITISh";
            }
        }

        function refreshDashboard() {
            localStorage.setItem('premium_habits', JSON.stringify(customHabits));
            renderElements();
        }

        function createNewHabit() {
            const nameInput = document.getElementById('new-habit-name');
            const timeInput = document.getElementById('new-habit-time');

            if(!nameInput.value.trim()) return;

            customHabits.push({
                id: Date.now(),
                name: nameInput.value.trim(),
                time: timeInput.value,
                done: false
            });

            nameInput.value = '';
            toggleCreator();
            refreshDashboard();
        }

        function removeHabit(id) {
            customHabits = customHabits.filter(h => h.id !== id);
            refreshDashboard();
        }

        function toggleHabitStatus(id) {
            const target = customHabits.find(h => h.id === id);
            if(target) {
                target.done = !target.done;
                refreshDashboard();

                if(target.done) {
                    const doneItems = customHabits.filter(h => h.done).length;
                    const totalItems = customHabits.length;
                    const finalPercent = Math.round((doneItems / totalItems) * 100);

                    // Bot kodi aniq o'qishi uchun formatlangan paket ma'lumoti
                    const packet = `${target.name} (Vaqt: ${target.time}) | Status: ${doneItems}/${totalItems} (${finalPercent}%)`;
                    
                    setTimeout(() => {
                        tg.sendData(packet);
                        tg.close();
                    }, 600);
                }
            }
        }

        function renderElements() {
            const listContainer = document.getElementById('habits-display-list');
            const dotsContainer = document.getElementById('timeline-dots-box');
            listContainer.innerHTML = '';
            dotsContainer.innerHTML = '';

            let doneCount = 0;
            
            // Odatlarni vaqti bo'yicha saralash
            customHabits.sort((a,b) => a.time.localeCompare(b.time));

            customHabits.forEach(habit => {
                if(habit.done) doneCount++;

                // Kartochkani yaratish
                const card = document.createElement('div');
                card.className = 'habit-card';
                card.innerHTML = `
                    <div class="habit-info-block">
                        <span class="habit-title-text">${habit.name}</span>
                        <span class="habit-time-badge">${habit.time}</span>
                    </div>
                    <div class="habit-actions">
                        <button class="neon-toggle-btn ${habit.done ? 'active-done' : ''}" onclick="toggleHabitStatus(${habit.id})">
                            ${habit.done ? '✓ OK' : 'Bajarish'}
                        </button>
                        <button class="trash-action" onclick="removeHabit(${habit.id})">🗑️</button>
                    </div>
                `;
                listContainer.appendChild(card);

                // Pastdagi chiroyli nuqtali grafikni yaratish
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${habit.done ? 'passed' : ''}`;
                dotsContainer.appendChild(dot);
            });

            // Hisob-kitoblar va vizualizatsiya
            const totalCount = customHabits.length;
            const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

            // Matnlarni o'zgartirish
            document.getElementById('lbl-total').innerText = totalCount + " ta";
            document.getElementById('lbl-done').innerText = doneCount + " ta";
            document.getElementById('counter-top').innerText = `${doneCount} / ${totalCount}`;
            document.getElementById('percentage-label').innerText = percent + "%";

            // Doiraviy aylanma progressni neon rangda chizish
            const circle = document.getElementById('progress-circle');
            const radius = circle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = offset;
        }

        // Dastlabki ishga tushirish
        renderElements();
    </script>
</body>
</html>
